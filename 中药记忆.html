const drugPinyinIndex = {};

function buildPinyinIndex() {
  if (!window.pinyinPro) return;
  GROUPS.forEach(g => {
    g.drugs.forEach(d => {
      if (drugPinyinIndex[d.name]) return;
      try {
        const full = window.pinyinPro.pinyin(d.name, { toneType: 'none', type: 'array' }).join('').toLowerCase();
        const initials = window.pinyinPro.pinyin(d.name, { pattern: 'first', toneType: 'none', type: 'array' }).join('').toLowerCase();
        drugPinyinIndex[d.name] = { full, initials };
      } catch (e) {
        drugPinyinIndex[d.name] = { full: '', initials: '' };
      }
    });
  });
}

function drugMatchesSearch(drug, search) {
  const raw = (search || '').trim();
  if (!raw) return true;
  // 中文名匹配
  if (drug.name.includes(raw)) return true;
  // 拼音匹配
  const s = raw.toLowerCase();
  const py = drugPinyinIndex[drug.name];
  if (py) {
    if (py.full.includes(s)) return true;      // 全拼（如 mahuang）
    if (py.initials.startsWith(s)) return true; // 首字母（如 mh）
  }
  return false;
}

function usernameToEmail(username) {
  const name = username.toLowerCase().trim();
  let encoded = '';
  for (const ch of name) {
    if (/[a-z0-9_]/.test(ch)) {
      encoded += ch;
    } else {
      encoded += '_' + ch.codePointAt(0).toString(16);
    }
  }
  return encoded + '@herb.local';
}

function saveProgress(p) { localStorage.setItem(progressKey(), JSON.stringify(p)); }

function loadSettings() {

    return { ...DEFAULT_SETTINGS, ...s };
  } catch (e) { return { ...DEFAULT_SETTINGS }; }
}
function saveSettings(s) { localStorage.setItem(settingsKey(), JSON.stringify(s)); }

function setSyncStatus(text) {

// 云同步
// ============================================================
let syncTimer = null;
let isCompareComposing = false;
let compareSearchTimer = null;
function scheduleSync() {
  if (!currentUserId) return;
  if (syncTimer) clearTimeout(syncTimer);
  syncTimer = setTimeout(() => syncToCloud(), 3000);
}

async function syncToCloud() {
  if (!currentUserId) return;
  const p = loadProgress();
  const rows = [];
  GROUPS.forEach(g => {
    const gp = p.groups && p.groups[g.groupId];
    if (!gp || !gp.learned) return;
    g.drugs.forEach(d => {
      const dp = gp.drugs && gp.drugs[d.name];
      if (!dp) return;
      dp.effects.forEach((e, i) => {
        rows.push({
          user_id: currentUserId,
          drug_id: g.groupId + '_' + d.name,
          effect_id: String(i),
          reps: e.reps || 0,
          interval: e.interval || 0,
          next_review_at: e.nextReview || null,
          lapses: e.lapses || 0,
          today_date: e.todayDate || null,
          today_done: e.todayDone || 0,
          today_target: e.todayTarget || 1,
          curve_updated: e.curveUpdated || false,
          ever_correct: e.everCorrect || false,
          updated_at: new Date().toISOString()
        });
      });
    });
  });

  setSyncStatus('同步中…');
  try {
    if (rows.length > 0) {
      for (let i = 0; i < rows.length; i += 100) {
        const { error } = await sb.from('user_progress')
          .upsert(rows.slice(i, i + 100), { onConflict: 'user_id,drug_id,effect_id' });
        if (error) throw error;
      }
    }
    const s = loadSettings();
    const ck = loadCheckin();
    const { error: se } = await sb.from('user_settings')
      .upsert({
        user_id: currentUserId,
        total_per_day: s.totalPerDay,
        checkin_dates: JSON.stringify(ck.dates || []),
        done_date: isDoneToday() ? todayStr() : '',
        updated_at: new Date().toISOString()
      });
    if (se) throw se;
    // 同步学过的组
    const groupRows = [];
    GROUPS.forEach(g => {
      const gp = p.groups && p.groups[g.groupId];
      if (gp && gp.learned) {
        groupRows.push({ user_id: currentUserId, group_id: g.groupId, learned: true, learned_at: new Date().toISOString() });
      }
    });
    if (groupRows.length > 0) {
      const { error: ge } = await sb.from('user_groups')
        .upsert(groupRows, { onConflict: 'user_id,group_id' });
      if (ge) throw ge;
    }
    setSyncStatus('已同步 ' + new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }));
  } catch (err) {
    console.warn('同步失败', err);
    setSyncStatus('同步失败，稍后重试');
    if (syncTimer) clearTimeout(syncTimer);
    syncTimer = setTimeout(() => syncToCloud(), 30000);
  }
}

async function mergeFromCloud() {
  if (!currentUserId) return;
  try {
    const { data: settings } = await sb
      .from('user_settings').select('*').eq('user_id', currentUserId).maybeSingle();
    if (settings) {
      localStorage.setItem(settingsKey(), JSON.stringify({ totalPerDay: settings.total_per_day }));

      // 合并签到数据（本地 + 云端，取并集）
      if (settings.checkin_dates) {
        try {
          const cloudDates = JSON.parse(settings.checkin_dates) || [];
          const local = loadCheckin();
          const merged = Array.from(new Set([...(local.dates || []), ...cloudDates]));
          merged.sort();
          // 只保留最近 90 天
          const trimmed = merged.slice(-90);
          localStorage.setItem(checkinKey(), JSON.stringify({ dates: trimmed }));
        } catch (e) { console.warn('签到数据合并失败', e); }
      }

      // 合并"今日完成"标记：云端已完成为今天 → 本地也标记
      if (settings.done_date === todayStr() && !isDoneToday()) {
        localStorage.setItem(doneKey(), '1');
      }
    }
    const { data: progress } = await sb
      .from('user_progress').select('*').eq('user_id', currentUserId);
    const { data: groupRows } = await sb
      .from('user_groups').select('*').eq('user_id', currentUserId);

    const local = loadProgress();
    if (!local.groups) local.groups = {};

    (groupRows || []).forEach(row => {
      const gid = String(row.group_id);
      if (!local.groups[gid]) local.groups[gid] = { learned: false, drugs: {} };
      if (row.learned) local.groups[gid].learned = true;
    });

    (progress || []).forEach(row => {
      const [gidStr, dname] = row.drug_id.split('_');
      const gid = gidStr;
      if (!local.groups[gid]) local.groups[gid] = { learned: true, drugs: {} };
      local.groups[gid].learned = true;
      const gp = local.groups[gid];
      if (!gp.drugs) gp.drugs = {};
      if (!gp.drugs[dname]) gp.drugs[dname] = { effects: [] };
      const dp = gp.drugs[dname];
      const eid = parseInt(row.effect_id);
      if (!dp.effects[eid]) dp.effects[eid] = {};
      const e = dp.effects[eid];
      e.reps = Math.max(e.reps || 0, row.reps || 0);
      e.interval = Math.max(e.interval || 0, row.interval || 0);
      e.lapses = Math.max(e.lapses || 0, row.lapses || 0);
      e.everCorrect = e.everCorrect || row.ever_correct;
e.nextReview = [e.nextReview, row.next_review_at, todayStr()]
  .filter(Boolean).sort().pop();
      // today 相关字段按日期合并，避免旧云端日期覆盖本地当天进度
      const td = todayStr();
      if (row.today_date === td && e.todayDate !== td) {
        // 云端有今天数据，本地没有 → 采用云端
        e.todayDate = td;
        e.todayDone = row.today_done || 0;
        e.todayTarget = row.today_target || 1;
      } else if (row.today_date === td && e.todayDate === td) {
        // 都有今天数据 → 取较大值
        e.todayDone = Math.max(e.todayDone || 0, row.today_done || 0);
        e.todayTarget = Math.max(e.todayTarget || 1, row.today_target || 1);
      } else if (!e.todayDate) {
        // 本地无日期（首次拉取）→ 用云端历史值，ensureToday 会处理重置
        e.todayDate = row.today_date || td;
        e.todayDone = row.today_done || 0;
        e.todayTarget = row.today_target || 1;
      }
      // 其余情况（本地有今天数据、云端是旧的）→ 保留本地，不动
      e.curveUpdated = e.curveUpdated || row.curve_updated;
    });

    saveProgress(local);
  } catch (err) {
    console.warn('拉取失败', err);
  }
}

// ============================================================
// 工具
// ============================================================
function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function addDays(dateStr, days) {
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  dt.setDate(dt.getDate() + days);
  return dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0') + '-' + String(dt.getDate()).padStart(2,'0');
}
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function effectsKey(effects) { return effects.join('|'); }

// ============================================================
// 进度
// ============================================================
function ensureDrugDP(gp, drug) {
  if (!gp.drugs) gp.drugs = {};
  if (!gp.drugs[drug.name]) {
    gp.drugs[drug.name] = {
      effects: drug.effects.map(() => ({
        reps: 0, interval: 0, nextReview: todayStr(), lapses: 0,
        todayDate: todayStr(), todayDone: 0, todayTarget: 1, curveUpdated: false,
        everCorrect: false,
        dayAttempted: false, dayPassed: false, dayWrongFirst: false, dayCorrectTypes: [],
        dayWrongCount: 0
      }))
    };
  }
  return gp.drugs[drug.name];
}
function ensureToday(dp) {
  const today = todayStr();
  if (dp.todayDate !== today) {
    dp.todayDate = today;
    dp.todayDone = 0;
    dp.curveUpdated = false;
    const lapses = dp.lapses || 0;
    if (lapses >= 3) dp.todayTarget = 3;
    else if (lapses >= 1) dp.todayTarget = 2;
    else dp.todayTarget = 1;
    dp.dayAttempted = false;
    dp.dayPassed = false;
    dp.dayWrongFirst = false;
    dp.dayCorrectTypes = [];
    dp.dayWrongCount = 0;
  }
  if (dp.dayAttempted === undefined) dp.dayAttempted = false;
  if (dp.dayPassed === undefined) dp.dayPassed = false;
  if (dp.dayWrongFirst === undefined) dp.dayWrongFirst = false;
  if (!dp.dayCorrectTypes) dp.dayCorrectTypes = [];
}
function drugMastered(gp, drug) {
  const dp = gp.drugs && gp.drugs[drug.name];
  if (!dp || !dp.effects) return false;
  return drug.effects.every((_, i) => dp.effects[i] && dp.effects[i].everCorrect);
}

function groupMastered(gp, group) {
  if (!gp) return false;
  return group.drugs.every(d => drugMastered(gp, d));
}

function updateEffectProgress(groupId, drugName, effectIdx, level) {
  const p = loadProgress();
  if (!p.groups) p.groups = {};
  if (!p.groups[groupId]) p.groups[groupId] = { learned: true, drugs: {} };
  const gp = p.groups[groupId];
  const drug = GROUPS.find(g => g.groupId === groupId).drugs.find(d => d.name === drugName);
  ensureDrugDP(gp, drug);
  const dp = gp.drugs[drugName];
  const e = dp.effects[effectIdx];
  ensureToday(e);
  const today = todayStr();
  e.todayDone++;
  if (level === 'correct') {
    if (!e.curveUpdated) {
      e.curveUpdated = true;
      e.reps = (e.reps || 0) + 1;
      const idx = Math.min(e.reps, INTERVALS.length - 1);
      e.interval = INTERVALS[idx];
      e.nextReview = addDays(today, e.interval);
    }
    e.everCorrect = true;
  } else if (level === 'wrong') {
    if (!e.curveUpdated) {
      e.curveUpdated = true;
      e.interval = Math.max(1, Math.round((e.interval || 1) * 0.6));
      e.nextReview = addDays(today, e.interval);
    }
    e.lapses = (e.lapses || 0) + 1;
  }
  saveProgress(p);
  return e.todayDone < e.todayTarget;
}
function recordLapse(groupId, drugName, effectIdx) {
  // effectIdx 为 null/<0 时：记录该药全部功效点
  // effectIdx >= 0 时：只记录该功效点
  const p = loadProgress();
  if (!p.groups) p.groups = {};
  if (!p.groups[groupId]) p.groups[groupId] = { learned: true, drugs: {} };
  const gp = p.groups[groupId];
  const drug = GROUPS.find(g => g.groupId === groupId).drugs.find(d => d.name === drugName);
  if (!drug) return;
  ensureDrugDP(gp, drug);
  const dp = gp.drugs[drugName];
  const idxs = (effectIdx == null || effectIdx < 0)
    ? drug.effects.map((_, i) => i)
    : [effectIdx];
  idxs.forEach(i => {
    if (dp.effects[i]) {
      dp.effects[i].lapses = (dp.effects[i].lapses || 0) + 1;
    }
  });
  saveProgress(p);
  scheduleSync();
}
function markDrugAllCorrect(groupId, drugName) {
  const p = loadProgress();
  if (!p.groups[groupId]) p.groups[groupId] = { learned: true, drugs: {} };
  const gp = p.groups[groupId];
  const drug = GROUPS.find(g => g.groupId === groupId).drugs.find(d => d.name === drugName);
  ensureDrugDP(gp, drug);
  const dp = gp.drugs[drugName];
  dp.effects.forEach((e) => {
    ensureToday(e);
    e.todayDone++;
    if (!e.curveUpdated) {
      e.curveUpdated = true;
      e.reps = (e.reps || 0) + 1;
      const idx = Math.min(e.reps, INTERVALS.length - 1);
      e.interval = INTERVALS[idx];
      e.nextReview = addDays(todayStr(), e.interval);
    }
    e.everCorrect = true;
  });
  saveProgress(p);
}

function markDrugReviewedToday(groupId, drugName) {
  // 只推进「今日已复习次数」，不改 everCorrect（区别于 markDrugAllCorrect）
  const p = loadProgress();
  if (!p.groups[groupId]) p.groups[groupId] = { learned: true, drugs: {} };
  const gp = p.groups[groupId];
  const drug = GROUPS.find(g => g.groupId === groupId).drugs.find(d => d.name === drugName);
  if (!drug) return;
  ensureDrugDP(gp, drug);
  const dp = gp.drugs[drugName];
  dp.effects.forEach(e => {
    ensureToday(e);
    e.todayDone++;
  });
  saveProgress(p);
}
// ============================================================
// 今日任务辅助（新版逻辑）
// ============================================================

// 当前 task 组里今天要处理的药
function taskDrugs(task) {
  const p = loadProgress();
  const gp = p.groups[task.groupId];
  if (!gp || !gp.drugs) return [];
  const group = GROUPS.find(g => g.groupId === task.groupId);
  if (!group) return [];

  // 先对本组所有药做今日重置
  group.drugs.forEach(d => {
    const dp = gp.drugs[d.name];
    if (dp && dp.effects) {
      dp.effects.forEach(e => { if (e) ensureToday(e); });
    }
  });

  const today = todayStr();
  return group.drugs.filter(d => {
    const dp = gp.drugs[d.name];
    if (!dp || !dp.effects) return false;
    if (task.kind === 'learn') return true;

    // 针对性复习：只挑指定的药
    if (state.targetedReview) {
      return state.targetedDrugs.some(t => t.groupId === task.groupId && t.drugName === d.name);
    }

    // 错题练习模式：只挑还有错题的药
    if (state.errorPractice) {
      return dp.effects.some(e => e && (e.lapses || 0) > 0);
    }

    // 正常复习模式：挑今天到期的药
    return dp.effects.some(e => e && e.nextReview <= today);
  }).map(d => ({ groupId: task.groupId, drugName: d.name }));
}
// 该药今天是否所有功效点都通过了
function drugDayComplete(groupId, drugName) {
  const p = loadProgress();
  const gp = p.groups[groupId];
  const dp = gp && gp.drugs && gp.drugs[drugName];
  if (!dp || !dp.effects) return false;
  const drug = GROUPS.find(g => g.groupId === groupId).drugs.find(d => d.name === drugName);
  if (!drug) return true;
  return drug.effects.every((_, i) => dp.effects[i] && dp.effects[i].dayPassed);
}

// 从当前 task 里随机挑一个未完成的药
function pickNextDrugInTask() {
  const task = state.tasks[state.taskIndex];
  if (!task) return null;
  const drugs = taskDrugs(task);
  let incomplete;
  if (state.targetedReview) {
    // 针对性复习：只挑本次会话还没答对的药
    incomplete = drugs.filter(d => !state.targetedCorrectDrugs.includes(d.drugName));
  } else {
    incomplete = drugs.filter(d => !drugDayComplete(d.groupId, d.drugName));
  }
  if (incomplete.length === 0) return null;
  return incomplete[Math.floor(Math.random() * incomplete.length)];
}
// 决定这药该出什么题型
function pickTypeForDrug(groupId, drugName) {
  const p = loadProgress();
  const gp = p.groups[groupId];
  const dp = gp && gp.drugs && gp.drugs[drugName];
  const drug = GROUPS.find(g => g.groupId === groupId).drugs.find(d => d.name === drugName);
  if (!dp || !drug) return 'forward';

  const unpassed = [];
  drug.effects.forEach((_, i) => {
    const e = dp.effects[i];
    if (e && !e.dayPassed) unpassed.push({ idx: i, e });
  });
  if (unpassed.length === 0) return 'forward';

  // 5% 概率插反向题（纯加练，不推进进度）
  if (Math.random() < 0.05) return 'reverse';

  // 有首问点 → 出正向/多选
  if (unpassed.some(u => !u.e.dayAttempted)) {
    return Math.random() < 0.5 ? 'forward' : 'multi';
  }

  // 都进入重试模式 → 看缺什么题型
  const missing = new Set();
  unpassed.forEach(u => {
    ['forward', 'multi', 'yesno'].forEach(t => {
      if (!u.e.dayCorrectTypes.includes(t)) missing.add(t);
    });
  });
  if (missing.size === 0) return 'forward';
  const arr = [...missing];
  return arr[Math.floor(Math.random() * arr.length)];
}

// 按答题结果更新所有相关功效点的今日状态
function applyAnswerToEffects(groupId, drugName, type, correct, targetEffectIdx) {
  if (state.dailyTest) return; // 每日小测不影响学习进度
  // 针对性复习：标记本次会话已答对的药
  if (state.targetedReview && correct && !state.targetedCorrectDrugs.includes(drugName)) {
    state.targetedCorrectDrugs.push(drugName);
  }
  const p = loadProgress();
  if (!p.groups[groupId]) p.groups[groupId] = { learned: true, drugs: {} };
  const gp = p.groups[groupId];
  const drug = GROUPS.find(g => g.groupId === groupId).drugs.find(d => d.name === drugName);
  if (!drug) return;
  ensureDrugDP(gp, drug);
  const dp = gp.drugs[drugName];
  const today = todayStr();

  // 反向题：不推进任何进度
  if (type === 'reverse') return;

  let targets = [];
  if (type === 'yesno') {
    if (targetEffectIdx == null || targetEffectIdx < 0) return;
    targets = [targetEffectIdx];
  } else {
    drug.effects.forEach((_, i) => {
      if (dp.effects[i] && !dp.effects[i].dayPassed) targets.push(i);
    });
  }

  targets.forEach(i => {
    const e = dp.effects[i];
    if (!e) return;
    ensureToday(e);
    if (correct) {
      let justPassed = false;
      if (!e.dayAttempted) {
        e.dayAttempted = true;
        e.dayPassed = true;
        justPassed = true;
      } else {
        if (!e.dayCorrectTypes.includes(type)) {
          e.dayCorrectTypes.push(type);
        }
        if (e.dayCorrectTypes.length >= 3) {
          e.dayPassed = true;
          justPassed = true;
        }
      }
      if (justPassed) {
        e.reps = (e.reps || 0) + 1;
        const idx = Math.min(e.reps, INTERVALS.length - 1);
        e.interval = INTERVALS[idx];
        e.nextReview = addDays(today, e.interval);
      }
      e.everCorrect = true;
      e.lapses = 0; // 👈 新增这一行：答对即清零错题标记
    } else {
      // 答错逻辑
      if (!e.dayAttempted) {
        e.dayAttempted = true;
        e.dayWrongFirst = true;
      }
      e.lapses = (e.lapses || 0) + 1;
      e.dayWrongCount = (e.dayWrongCount || 0) + 1;
    }
  });

  saveProgress(p);
  scheduleSync();
}

// ============================================================
// 构建任务
// ============================================================
function buildTasks() {
  const p = loadProgress();
  const settings = loadSettings();
  const N = settings.totalPerDay;
  const today = todayStr();
  const tasks = [];

  // 判断组是否"实际学过"——只要有一味药有进度记录就算
  function groupStarted(gp, group) {
    if (!gp || !gp.drugs) return false;
    return group.drugs.some(d => gp.drugs[d.name] && gp.drugs[d.name].effects && gp.drugs[d.name].effects.length);
  }

  // 到期复习的组，按最早到期升序
  const reviewGroups = [];
  GROUPS.forEach(g => {
    const gp = p.groups && p.groups[g.groupId];
    if (!groupStarted(gp, g)) return;
    let hasDue = false;
    let earliest = '9999';
    g.drugs.forEach(d => {
      const dp = gp.drugs && gp.drugs[d.name];
      if (!dp || !dp.effects) return;
      dp.effects.forEach(e => {
        if (!e) return;
        ensureToday(e);
        if (e.nextReview <= today) {
          hasDue = true;
          if (e.nextReview < earliest) earliest = e.nextReview;
        }
      });
    });
    if (hasDue) reviewGroups.push({ group: g, earliest });
  });
  reviewGroups.sort((a, b) => a.earliest.localeCompare(b.earliest));

  // 取前 N 个复习组（占额度）
  const reviewTake = reviewGroups.slice(0, N);
  reviewTake.forEach(item => {
    tasks.push({ kind: 'review', groupId: item.group.groupId });
  });

  // 剩余额度学新组
  let remaining = N - reviewTake.length;
  for (const g of GROUPS) {
    if (remaining <= 0) break;
    const gp = p.groups && p.groups[g.groupId];
    if (groupStarted(gp, g)) continue;
    tasks.push({ kind: 'learn', groupId: g.groupId });
    remaining--;
  }

  return { tasks, reviewCount: reviewTake.length, newCount: N - reviewTake.length - remaining };
}

function sessionKey() { return 'herb_session_' + currentUserId; }

function saveSession() {
  if (!currentUserId) return;
  if (state.mode === 'login' || state.mode === 'home') {
    localStorage.removeItem(sessionKey());
    return;
  }
  // 👇 新增：错题练习 / 针对性复习 / 每日小测 不覆盖今日学习的进度 session
  if (state.errorPractice || state.targetedReview || state.dailyTest) {

  }
  const data = {

    mode: state.mode,
    tasks: state.tasks,
    taskIndex: state.taskIndex,
    taskQueue: state.taskQueue,
    queueIndex: state.queueIndex,
    learnGroupId: state.learnGroupId,
    learnDrugIndex: state.learnDrugIndex,
    sessionStats: state.sessionStats,
    errorPractice: state.errorPractice,
    targetedReview: state.targetedReview,
    targetedDrugs: state.targetedDrugs,
    targetedCorrectDrugs: state.targetedCorrectDrugs
  };
  localStorage.setItem(sessionKey(), JSON.stringify(data));
}

function restoreSession() {
  if (!currentUserId) return false;
  try {
    const raw = localStorage.getItem(sessionKey());
    if (!raw) return false;
    const s = JSON.parse(raw);
    if (s.date !== todayStr()) {
      localStorage.removeItem(sessionKey());
      return false;
    }
    if (s.mode === 'done' || s.mode === 'home' || s.mode === 'login') return false;
    if (!s.tasks || s.tasks.length === 0) return false;
    if (s.taskIndex >= s.tasks.length) return false;

    state.tasks = s.tasks;
    state.taskIndex = s.taskIndex;
    state.learnGroupId = s.learnGroupId;
    state.learnDrugIndex = s.learnDrugIndex || 0;
    state.sessionStats = s.sessionStats || { firstTry: 0, retry: 0 };
    state.errorPractice = s.errorPractice || false;
    state.targetedReview = s.targetedReview || false;
    state.targetedDrugs = s.targetedDrugs || [];
    state.targetedCorrectDrugs = s.targetedCorrectDrugs || [];
    if (s.mode === 'learn') {
      state.mode = 'learn';
      return true;
    }
    if (s.mode === 'quiz') {
      pickNextQuestionInTask();
      return true;
    }
    return false;
  } catch (e) {
    return false;
  }
}

function hasActiveSession() {
  if (!currentUserId) return false;
  try {
    const raw = localStorage.getItem(sessionKey());
    if (!raw) return false;
    const s = JSON.parse(raw);
    if (s.date !== todayStr()) return false;
    if (s.mode === 'done' || s.mode === 'home' || s.mode === 'login') return false;
    if (!s.tasks || s.tasks.length === 0) return false;
    if (s.taskIndex >= s.tasks.length) return false;
    return true;
  } catch (e) {
    return false;
  }
}

// ============================================================
// 出题
// ============================================================
function getEffectAndOwnerNotInDrug(drug) {
  const drugSet = new Set(drug.effects);
  const cands = [];
  GROUPS.forEach(g => g.drugs.forEach(d => {
    if (d.name === drug.name) return;
    d.effects.forEach(e => { if (!drugSet.has(e)) cands.push({ effect: e, owner: d.name }); });
  }));
  if (!cands.length) return null;
  return cands[Math.floor(Math.random() * cands.length)];
}

function genForwardOptions(q) {
  const seen = new Set([effectsKey(q.effects)]);
  const dists = [];
  const tryAdd = d => { const k = effectsKey(d.effects); if (!seen.has(k)) { seen.add(k); dists.push(d); } };
  const grp = GROUPS.find(g => g.groupId === q.groupId);
  grp.drugs.forEach(d => { if (d.name !== q.drugName) tryAdd(d); });
  if (dists.length < 3) GROUPS.forEach(g => { if (g.chapter === q.chapter && g.groupId !== q.groupId) g.drugs.forEach(d => { if (dists.length < 3) tryAdd(d); }); });
  if (dists.length < 3) GROUPS.forEach(g => g.drugs.forEach(d => { if (dists.length < 3) tryAdd(d); }));
  const picked = shuffle(dists).slice(0, 3);
  return shuffle([{ name: q.drugName, effects: q.effects }, ...picked.map(d => ({ name: d.name, effects: d.effects }))]);
}

function genReverseOptions(q) {
  const seen = new Set([q.drugName]);
  const dists = [];
  const tryAdd = d => { if (!seen.has(d.name)) { seen.add(d.name); dists.push(d); } };
  const grp = GROUPS.find(g => g.groupId === q.groupId);
  grp.drugs.forEach(d => { if (d.name !== q.drugName) tryAdd(d); });
  if (dists.length < 3) GROUPS.forEach(g => { if (g.chapter === q.chapter && g.groupId !== q.groupId) g.drugs.forEach(d => { if (dists.length < 3) tryAdd(d); }); });
  if (dists.length < 3) GROUPS.forEach(g => g.drugs.forEach(d => { if (dists.length < 3) tryAdd(d); }));
  const picked = shuffle(dists).slice(0, 3);
  return shuffle([{ name: q.drugName, effects: q.effects }, ...picked.map(d => ({ name: d.name, effects: d.effects }))]);
}

function genMultiOptions(drug) {
  const correct = [...drug.effects];
  const set = new Set(correct);
  const wrongC = [];
  GROUPS.forEach(g => g.drugs.forEach(d => {
    if (d.name === drug.name) return;
    d.effects.forEach(e => { if (!set.has(e) && !wrongC.includes(e)) wrongC.push(e); });
  }));
  const wrongN = Math.max(1, 5 - correct.length);
  const wrongs = shuffle(wrongC).slice(0, wrongN);
  return shuffle([
    ...correct.map(e => ({ text: e, isCorrect: true })),
    ...wrongs.map(e => ({ text: e, isCorrect: false }))
  ]);
}

function generateQuestion(groupId, drugName, forcedType) {
  const grp = GROUPS.find(g => g.groupId === groupId);
  const drug = grp.drugs.find(d => d.name === drugName);
  const base = {
    groupId, chapter: grp.chapter, groupNumber: grp.groupId,
    drugName: drug.name, effects: drug.effects, mnemonic: drug.mnemonic
  };
  const type = forcedType || 'forward';
  base.type = type;

  if (type === 'forward') {
    base.options = genForwardOptions(base);
    base.correctIndex = base.options.findIndex(o => effectsKey(o.effects) === effectsKey(drug.effects));
  } else if (type === 'reverse') {
    base.options = genReverseOptions(base);
    base.correctIndex = base.options.findIndex(o => o.name === drug.name);
  } else if (type === 'yesno') {
    const p = loadProgress();
    const gp = p.groups[groupId];
    const dp = gp && gp.drugs && gp.drugs[drugName];

    // 该药是否还有"今天没被考过"的功效点
    let hasFirstTimePoint = false;
    if (dp && dp.effects) {
      drug.effects.forEach((_, i) => {
        const e = dp.effects[i];
        if (e && !e.dayAttempted) hasFirstTimePoint = true;
      });
    }

    // 35% 概率出"不能"题（干扰项），无论当前是什么阶段
    if (Math.random() < 0.35) {
      const wrong = getEffectAndOwnerNotInDrug(drug);
      if (wrong) {
        base.yesnoEffect = wrong.effect;
        base.yesnoAnswer = false;
        base.yesnoOwner = wrong.owner;
        base.yesnoEffectIdx = -1;
        base.correctIndex = 1;
        return base;
      }
    }
    // 出"能"题：优先考一个缺 yesno 的未通过点
    let targetIdx = -1;
    if (dp && dp.effects) {
      const candidates = [];
      drug.effects.forEach((_, i) => {
        const e = dp.effects[i];
        if (e && !e.dayPassed && !e.dayCorrectTypes.includes('yesno')) {
          candidates.push(i);
        }
      });
      if (candidates.length > 0) {
        targetIdx = candidates[Math.floor(Math.random() * candidates.length)];
      }
    }
    if (targetIdx < 0) {
      targetIdx = Math.floor(Math.random() * drug.effects.length);
    }
    base.yesnoEffectIdx = targetIdx;
    base.yesnoEffect = drug.effects[targetIdx];
    base.yesnoAnswer = true;
    base.yesnoOwner = drug.name;
    base.correctIndex = 0;
  } else if (type === 'multi') {
    base.multiOptions = genMultiOptions(drug);
    base.correctSet = new Set();
    base.multiOptions.forEach((o, i) => { if (o.isCorrect) base.correctSet.add(i); });
  }
  return base;
}
// ============================================================
// 作答
// ============================================================
function chooseOption(index) {
  if (state.solved) return;
  if (state.wrongChoices.has(index)) return;
  const q = state.question;
  const isCorrect = index === q.correctIndex;

  if (!isCorrect) {
    state.firstTry = false;
    state.wrongChoices.add(index);
    if (q.type === 'yesno') {
      applyAnswerToEffects(q.groupId, q.drugName, 'yesno', false, q.yesnoEffectIdx);
    } else if (q.type === 'forward' || q.type === 'multi') {
      applyAnswerToEffects(q.groupId, q.drugName, q.type, false, -1);
    }
    render();
    return;
  }

  state.solved = true;
  const wrongCount = state.wrongChoices.size;
  if (wrongCount === 0) state.sessionStats.firstTry++;
  else state.sessionStats.retry++;

  if (q.type === 'yesno') {
    applyAnswerToEffects(q.groupId, q.drugName, 'yesno', true, q.yesnoEffectIdx);
  } else if (q.type === 'forward' || q.type === 'multi') {
    applyAnswerToEffects(q.groupId, q.drugName, q.type, true, -1);
  }
  // reverse：不动

  saveSession();
  render();
}
function toggleMultiOption(i) {
  if (state.solved || state.multiSubmitted) return;
  if (state.multiSelected.has(i)) state.multiSelected.delete(i);
  else state.multiSelected.add(i);
  render();
}

function submitMulti() {
  if (state.solved || state.multiSubmitted) return;
  if (state.multiSelected.size === 0) return;
  const q = state.question;
  const ok = state.multiSelected.size === q.correctSet.size &&
             [...state.multiSelected].every(i => q.correctSet.has(i));
  state.multiSubmitted = true;
  if (ok) {
    state.solved = true;
    if (state.submitAttempts === 0) state.sessionStats.firstTry++;
    else state.sessionStats.retry++;
    applyAnswerToEffects(q.groupId, q.drugName, 'multi', true, -1);
    saveSession();
  } else {
    state.submitAttempts++;
    state.firstTry = false;
    applyAnswerToEffects(q.groupId, q.drugName, 'multi', false, -1);
  }
  render();
}
function retryMulti() {
  state.multiSubmitted = false;
  state.multiSelected = new Set();
  render();
}

function nextTask() {

}

function startErrorPractice() {

// 渲染
// ============================================================
function render() {
  const app = document.getElementById('app');
  if (!currentUserId) {
    app.innerHTML = renderLogin();
    return;
  }
  let content = '';
  switch (state.mode) {
    case 'login': content = renderLogin(); break;
    case 'home': content = renderHome(); break;
    case 'learn': content = renderLearn(); break;
    case 'quiz': content = renderQuiz(); break;
    case 'done': content = renderDone(); break;
    case 'errors': content = renderErrors(); break;
    case 'compare': content = renderCompare(); break;
    case 'progress': content = renderProgressPage(); break;
    case 'settings': content = renderSettings(); break;
    case 'dailyTestResult': content = renderDailyTestResult(); break;
  }
  if (state.mode !== 'home' && state.mode !== 'login' && state.mode !== 'done') {
    content = '<button class="back-home-btn" onclick="backHome()">← 返回首页</button>' + content;
  }
  app.innerHTML = content;
  const el = document.getElementById('sync-status');
  if (el) el.textContent = syncStatus;
}
// 开始今日小测
function startDailyTest() {
  const drugs = getTodayPracticedDrugs();
  if (drugs.length === 0) {
    alert('今天还没有练习过任何药');
    return;
  }
  const queue = [];
  const allTypes = ['forward', 'reverse', 'yesno', 'multi'];
  drugs.forEach(d => {
    const n = 2 + Math.floor(Math.random() * 2); // 每味 2~3 题
    const usedTypes = [];
    for (let i = 0; i < n; i++) {
      let type;
      let tries = 0;
      do {
        type = allTypes[Math.floor(Math.random() * allTypes.length)];
        tries++;
      } while (usedTypes.includes(type) && tries < 8);
      usedTypes.push(type);
      queue.push({ groupId: d.groupId, drugName: d.drugName, type });
    }
  });
  state.dailyTestQueue = shuffle(queue); // 乱序
  state.dailyTestIndex = 0;
  state.dailyTestResults = [];
  state.dailyTest = true;
  state.dailyTestFinished = false;
  state.errorPractice = false;
  state.targetedReview = false;
  state.targetedDrugs = [];
  loadDailyTestQuestion();
}

function loadDailyTestQuestion() {
  if (state.dailyTestIndex >= state.dailyTestQueue.length) {
    state.dailyTestFinished = true;
    state.mode = 'dailyTestResult';
    render();
    return;
  }
  const item = state.dailyTestQueue[state.dailyTestIndex];
  state.question = generateQuestion(item.groupId, item.drugName, item.type);
  state.wrongChoices = new Set();
  state.multiSelected = new Set();
  state.multiSubmitted = false;
  state.submitAttempts = 0;
  state.solved = false;
  state.firstTry = true;
  state.mode = 'quiz';
  render();
}

function backToHomeFromTest() {
  state.dailyTest = false;
  state.dailyTestFinished = false;
  state.dailyTestQueue = [];
  state.dailyTestResults = [];
  state.dailyTestIndex = 0;
  state.mode = 'home';
  render();
}

function renderDailyTestResult() {
  const results = state.dailyTestResults;
  const total = results.length;
  const correct = results.filter(r => r.correct).length;
  const rate = total > 0 ? Math.round(correct / total * 100) : 0;

  const byDrug = {};
  results.forEach(r => {
    if (!byDrug[r.drugName]) byDrug[r.drugName] = { total: 0, correct: 0 };
    byDrug[r.drugName].total++;
    if (r.correct) byDrug[r.drugName].correct++;
  });

  const drugRows = Object.entries(byDrug).map(([name, s]) => {
    const perfect = s.correct === s.total;
    return `<div class="drug-progress-row">
      <div class="drug-progress-name">${name}</div>
      <div style="flex:1;text-align:right;font-size:13px;color:#8a6d3b;padding:0 10px;">
        一次答对 ${s.correct}/${s.total}
      </div>
      <div style="font-size:12px;${perfect ? 'background:#e3f0e3;color:#2e7d32;' : 'background:#fbe9e9;color:#c62828;'}padding:2px 10px;border-radius:10px;white-space:nowrap;">
        ${perfect ? '✓' : '需加强'}
      </div>
    </div>`;
  }).join('');

  const weakNames = Object.entries(byDrug)
    .filter(([_, s]) => s.correct < s.total)
    .map(([name]) => name);

  const extraBtn = weakNames.length > 0
    ? `<button class="primary" style="background:#c62828;" onclick="startTestTargetedReview()">针对 ${weakNames.length} 味薄弱药复习</button>
       <div style="height:10px;"></div>`
    : '';

  return `
    <div class="card big-center">
      <div class="big">📝</div>
      <h2>今日小测完成</h2>
      <p>共 ${total} 题 · 一次答对 ${correct} 题</p>
      <p style="font-size:28px;color:#8a6d3b;font-weight:700;margin-top:10px;">${rate}%</p>
    </div>
    <div class="card">
      <div class="group-header">各药表现</div>
      ${drugRows || '<div style="text-align:center;padding:20px;color:#999;">暂无数据</div>'}

    if (!Array.isArray(c.dates)) c.dates = [];
    return c;
  } catch (e) { return { dates: [] }; }
}
function saveCheckin(c) {
  localStorage.setItem(checkinKey(), JSON.stringify(c));
  scheduleSync();

// 计算连续签到天数（今天或昨天签过才算链子有效）
function calcStreak(dates) {
  if (!dates || dates.length === 0) return 0;
  const set = new Set(dates);
  const today = todayStr();
  const yesterday = addDays(today, -1);
  if (!set.has(today) && !set.has(yesterday)) return 0;
  let cur = set.has(today) ? today : yesterday;
  let streak = 0;
  while (set.has(cur)) {
    streak++;
    cur = addDays(cur, -1);
  }
  return streak;
}

function doCheckin() {
  const c = loadCheckin();
  const today = todayStr();
  if (!c.dates.includes(today)) {
    c.dates.push(today);
    // 只保留最近 90 天，避免无限增长
    if (c.dates.length > 90) c.dates = c.dates.slice(-90);
    saveCheckin(c);
  }
  render();
}

// 收集今天练过的所有药及其答题情况
function getTodayPracticedDrugs() {
  const p = loadProgress();
  const today = todayStr();
  const result = [];
  GROUPS.forEach(g => {
    const gp = p.groups && p.groups[g.groupId];
    if (!gp) return;
    g.drugs.forEach(d => {
      const dp = gp.drugs && gp.drugs[d.name];
      if (!dp || !dp.effects) return;
      let attempted = 0, passed = 0, wrongCount = 0;
      const weakIdx = [];
      dp.effects.forEach((e, i) => {
        if (!e || e.todayDate !== today) return;
        if (e.dayAttempted) attempted++;
        if (e.dayPassed) passed++;
        else if (e.dayAttempted) weakIdx.push(i);
        wrongCount += e.dayWrongCount || 0;
      });
      if (attempted === 0) return;
      result.push({
        groupId: g.groupId,
        drugName: d.name,
        effects: d.effects,
        attempted, passed, wrongCount, weakIdx,
        total: d.effects.length
      });
    });
  });
  result.sort((a, b) => b.wrongCount - a.wrongCount || b.weakIdx.length - a.weakIdx.length);
  return result;
}

// 开启针对性复习
function startTargetedReview() {
  const drugs = getTodayPracticedDrugs();
  const weak = drugs.filter(d => d.weakIdx.length > 0 || d.wrongCount > 0);
  if (weak.length === 0) {
    alert('今天所有药都已掌握，无需复习');
    return;
  }
  const groupMap = {};
  weak.forEach(d => {
    if (!groupMap[d.groupId]) groupMap[d.groupId] = { kind: 'review', groupId: d.groupId };
  });
  state.tasks = Object.values(groupMap);
  state.taskIndex = 0;
  state.sessionStats = { firstTry: 0, retry: 0 };
  state.targetedReview = true;
  state.targetedDrugs = weak.map(d => ({ groupId: d.groupId, drugName: d.drugName }));
  state.targetedCorrectDrugs = [];
  state.errorPractice = false;
  expandNextTask();
}

      ${todayDrugs.map(d => {
        const isWeak = d.weakIdx.length > 0;
        const hasWrong = d.wrongCount > 0;
        return `<div class="drug-progress-row" style="align-items:flex-start;">
          <div class="drug-progress-name">${d.drugName}</div>
          <div style="flex:1;text-align:right;font-size:13px;color:#666;padding:0 10px;">
            ${hasWrong ? `<span style="color:#c62828;">错 ${d.wrongCount} 次</span> · ` : ''}
            <span style="color:#8a6d3b;">${d.passed}/${d.total} 已通过</span>
          </div>
          <div style="font-size:12px;${isWeak ? 'background:#fbe9e9;color:#c62828;' : 'background:#e3f0e3;color:#2e7d32;'}padding:2px 10px;border-radius:10px;white-space:nowrap;">
            ${isWeak ? '需复习' : '✓'}
          </div>
        </div>`;
      }).join('')}
    </div>
  ` : '';

  const targetedBtn = weakDrugs.length > 0
    ? `<button class="primary" onclick="startTargetedReview()" style="background:#c62828;">针对 ${weakDrugs.length} 味薄弱药复习</button>
       <div style="height:10px;"></div>`
    : '';

  const dailyTestBtn = todayDrugs.length > 0
    ? `<button class="primary" onclick="startDailyTest()" style="background:#2e5075;">开始今日小测（${todayDrugs.length} 味药）</button>
       <div style="height:10px;"></div>`
    : '';
  return `
    <div class="card big-center">
      <div class="big">🎉</div>
      <h2>${title}</h2>
      ${todayDrugs.length === 0
        ? `<p>今天还没有练习过任何药</p>`
        : `<p>今日练习 <strong>${todayDrugs.length}</strong> 味药 · 共 ${todayTotal} 项功效</p>
           <p>已通过 ${todayPassed} 项 · 答错 ${todayWrong} 次</p>`}
    </div>
    ${drugListHtml}
    ${targetedBtn}
    ${dailyTestBtn}
    <button class="primary" onclick="goHome()">返回首页</button>
  `;
}
function renderErrors() {
  const p = loadProgress();
  const list = [];
  GROUPS.forEach(g => {
    const gp = p.groups && p.groups[g.groupId];
    if (!gp) return;
    g.drugs.forEach(d => {
      const dp = gp.drugs && gp.drugs[d.name];
      if (!dp || !dp.effects) return;
      const lapses = dp.effects.reduce((s, e) => s + (e && e.lapses || 0), 0);
      if (lapses > 0) {
        const unmastered = dp.effects.map((e, i) => !(e && e.everCorrect) ? d.effects[i] : null).filter(Boolean);
        list.push({ name: d.name, effects: d.effects, unmastered, lapses });
      }
    });
  });
  list.sort((a, b) => b.lapses - a.lapses);

  if (!list.length) {
    return `
      <div class="card">
        <div class="group-header">错题本</div>
        <div style="text-align:center;padding:30px;color:#999;font-size:14px;">还没有错题 💪</div>
      </div>
      <button class="primary" onclick="goHome()">返回首页</button>
    `;
  }

  const rows = list.map(it => `
    <div class="drug-progress-row" style="align-items:flex-start;">
      <div class="drug-progress-name">${it.name}</div>
      <div style="flex:1;text-align:right;font-size:13px;color:#666;padding:0 10px;">
        ${it.unmastered.length
          ? `未掌握：${it.unmastered.join('、')}`
          : `<span style="color:#999;">已全部掌握</span>`}
      </div>
      <div style="font-size:12px;background:#fbe9e9;color:#c62828;padding:2px 10px;border-radius:10px;white-space:nowrap;">错 ${it.lapses}</div>
    </div>
  `).join('');

  return `
    <div class="card">
      <div class="group-header">错题本 · ${list.length} 味</div>
      <h2>薄弱药味</h2>
      ${rows}
    </div>
    <button class="primary" onclick="startErrorPractice()">练习错题</button>
    <div style="height:10px;"></div>
    <button class="primary" style="background:#e8e2d6;color:#4a3f2f;" onclick="goHome()">返回首页</button>
  `;
}

function renderCompare() {
  return `
    <div class="card">
      <div class="group-header">对比表</div>
      <input class="login-input" id="compare-search" type="text"
        placeholder="🔍 搜索药名 / 拼音"
        value="${state.compareSearch || ''}"
        oninput="onCompareSearchInput(this)"
        oncompositionstart="onCompareSearchCompositionStart()"
        oncompositionend="onCompareSearchCompositionEnd(this)">
    </div>
    <div id="compare-content">${renderCompareContent(state.compareSearch || '')}</div>
    <button class="primary" onclick="goHome()">返回首页</button>
  `;
}

function renderCompareContent(search) {
  search = (search || '').trim();

  // ============ 搜索模式 ============
  if (search) {
    const results = [];
    GROUPS.forEach(g => {
      g.drugs.forEach(d => {
        if (drugMatchesSearch(d, search)) {
          results.push({ groupId: g.groupId, chapter: g.chapter, drug: d });
        }
      });
    });

    const resultsHtml = results.length === 0
      ? `<div style="text-align:center;padding:30px;color:#999;font-size:14px;">没有找到匹配的药</div>`
      : results.map(r => `
        <div class="drug-progress-row" style="cursor:pointer;" onclick="gotoCompareDrug(${r.groupId})">
          <div class="drug-progress-name">${r.drug.name}</div>
          <div style="flex:1;text-align:right;font-size:13px;color:#666;padding:0 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
            ${r.drug.effects.join('、')}
          </div>
          <div style="font-size:12px;color:#8a6d3b;white-space:nowrap;">第 ${r.groupId} 组 ›</div>
        </div>
      `).join('');

    return `
      <div class="card">
        <div class="group-header">搜索结果 · ${results.length} 味</div>
        ${resultsHtml}
      </div>
    `;
  }

  // ============ 常规模式：两级 tab ============
  const chapterGroups = {};
  GROUPS.forEach(g => {
    const mainChapter = g.chapter.split('/')[0].trim();
    if (!chapterGroups[mainChapter]) chapterGroups[mainChapter] = [];
    chapterGroups[mainChapter].push(g);
  });
  const chapterNames = Object.keys(chapterGroups);

  if (!state.compareChapter || !chapterNames.includes(state.compareChapter)) {
    state.compareChapter = chapterNames[0];
  }

  const chapterGroupList = chapterGroups[state.compareChapter].filter(g => g.drugs.length >= 2);

  if (!state.compareGroupId
      || !GROUPS.some(g => g.groupId === state.compareGroupId)
      || !chapterGroupList.some(g => g.groupId === state.compareGroupId)) {
    state.compareGroupId = chapterGroupList.length > 0 ? chapterGroupList[0].groupId : null;
  }

  const currentGroup = GROUPS.find(g => g.groupId === state.compareGroupId);

  const chapterTabs = chapterNames.map(c =>
    `<button class="tab ${c === state.compareChapter ? 'active' : ''}" onclick="selectChapter('${c}')">${c}</button>`
  ).join('');

  const groupTabs = chapterGroupList.map(g => {
    const label = g.drugs.map(d => d.name).join('·');
    const cls = g.groupId === state.compareGroupId ? 'active' : '';
    return `<button class="tab ${cls}" onclick="selectGroup(${g.groupId})">${label}</button>`;
  }).join('');

  let tableHtml = '';
  if (currentGroup) {
    const drugs = currentGroup.drugs;
    const effectMap = {};
    drugs.forEach(d => d.effects.forEach(e => {
      if (!effectMap[e]) effectMap[e] = new Set();
      effectMap[e].add(d.name);
    }));
    const effectList = Object.keys(effectMap).sort((a, b) => {
      const na = effectMap[a].size, nb = effectMap[b].size;
      return na !== nb ? nb - na : a.localeCompare(b);
    });
    const headerRow = `<tr><th style="text-align:left;">功效</th>${drugs.map(d => `<th>${d.name}</th>`).join('')}</tr>`;
    const bodyRows = effectList.map(e => {
      const shared = effectMap[e].size > 1;
      const cells = drugs.map(d => {
        const has = d.effects.includes(e);
        return `<td class="${has ? 'cell-yes' : 'cell-no'}">${has ? '✓' : '·'}</td>`;
      }).join('');
      return `<tr class="${shared ? 'shared' : 'unique'}"><td class="effect-label">${e}</td>${cells}</tr>`;
    }).join('');
    tableHtml = `<table class="compare-table"><thead>${headerRow}</thead><tbody>${bodyRows}</tbody></table>`;
  } else {
    tableHtml = `<div style="text-align:center;padding:30px;color:#999;font-size:14px;">该章节没有可对比的组</div>`;
  }

  return `
    <div class="card">
      <div class="chapter-tabs">${chapterTabs}</div>
      <div style="font-size:12px;color:#999;margin:12px 0 6px;">选择组：</div>
      <div class="chapter-tabs" style="flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;">${groupTabs}</div>
    </div>
    <div class="card">
      ${currentGroup ? `<h2>第 ${currentGroup.groupId} 组 · ${currentGroup.chapter.split('/').pop().trim()}</h2>` : ''}
      <div class="compare-scroll">${tableHtml}</div>
      <div style="font-size:12px;color:#999;margin-top:12px;line-height:1.7;">
        <span style="background:#fffbe8;padding:1px 6px;border-radius:4px;">黄底行</span> = 该药独有功效
      </div>
    </div>
  `;
}

function updateCompareUI(v) {
  state.compareSearch = v || '';
  const input = document.getElementById('compare-search');
  if (input && input.value !== state.compareSearch) {
    input.value = state.compareSearch;
  }
  const container = document.getElementById('compare-content');
  if (container) {
    container.innerHTML = renderCompareContent(state.compareSearch);
  }
}

function selectGroup(gid) {
  state.compareGroupId = gid;
  updateCompareUI(state.compareSearch);
}

function onCompareSearchInput(el) {
  // 延迟 500ms 再更新，给输入法留出进入组合状态的时间
  if (compareSearchTimer) clearTimeout(compareSearchTimer);
  compareSearchTimer = setTimeout(() => {
    compareSearchTimer = null;
    if (isCompareComposing) return;
    updateCompareUI(el.value);
  }, 500);
}

function onCompareSearchCompositionStart() {
  isCompareComposing = true;
  if (compareSearchTimer) {
    clearTimeout(compareSearchTimer);
    compareSearchTimer = null;
  }
}

function onCompareSearchCompositionEnd(el) {
  isCompareComposing = false;
  updateCompareUI(el.value);
}

function clearCompareSearch() {
  updateCompareUI('');
}

function gotoCompareDrug(groupId) {
  const g = GROUPS.find(x => x.groupId === groupId);
  if (!g) return;
  state.compareChapter = g.chapter.split('/')[0].trim();
  state.compareGroupId = groupId;
  updateCompareUI('');
}
function renderProgressPage() {
  const p = loadProgress();
  const rows = [];
  let totalE = 0, okE = 0;
  GROUPS.forEach(g => {
    const gp = p.groups && p.groups[g.groupId];
    if (!gp || !gp.learned) return;
    g.drugs.forEach(d => {
      const dp = gp.drugs && gp.drugs[d.name];
      if (!dp || !dp.effects) return;
      const dots = d.effects.map((_, i) => {
        const e = dp.effects[i];
        totalE++;
        const on = e && e.everCorrect;
        if (on) okE++;
        return `<span class="dot ${on ? 'on' : ''}"></span>`;
      }).join('');
      const ok = d.effects.filter((_, i) => dp.effects[i] && dp.effects[i].everCorrect).length;
      rows.push(`
        <div class="drug-progress-row">
          <div class="drug-progress-name">${d.name}</div>
          <div class="drug-progress-dots">${dots}<span class="progress-count">${ok}/${d.effects.length}</span></div>
        </div>
      `);
    });
  });
  if (!rows.length) {
    return `
      <div class="card"><div style="text-align:center;padding:30px;color:#999;">还没有学过的药</div></div>
      <button class="primary" onclick="goHome()">返回首页</button>
    `;
  }
  return `
    <div class="card">
      <div class="group-header">功效点掌握度</div>
      <h2>${okE}/${totalE} 已答对</h2>
      <div style="font-size:12px;color:#999;margin-bottom:8px;">每个圆点对应一个功效，答对过一次亮起</div>
      ${rows.join('')}
    </div>
    <button class="primary" onclick="goHome()">返回首页</button>
  `;
}

function renderSettings() {
  const s = state.settingsDraft || loadSettings();
  return `
    <div class="card">
      <div class="group-header">学习设置</div>
      <h2>每天总组数</h2>
      <div class="setting-desc">复习优先，剩余名额给新学。范围 0～100 组。</div>
      <div class="setting-input">
        <button onclick="changeSetting(-1)" ${s.totalPerDay <= 0 ? 'disabled' : ''}>−</button>
        <div class="setting-value">${s.totalPerDay}</div>
        <button onclick="changeSetting(1)" ${s.totalPerDay >= 100 ? 'disabled' : ''}>＋</button>
      </div>
    </div>
    <button class="primary" onclick="saveSettingsAndBack()">保存</button>
    <div style="height:10px;"></div>
    <button class="primary" style="background:#e8e2d6;color:#4a3f2f;" onclick="goHome()">返回</button>
    <div style="height:20px;"></div>
    <button class="primary" style="background:#fbe9e9;color:#c62828;" onclick="doLogout()">退出登录</button>
  `;
}

// ============================================================
// 启动
// ============================================================
buildPinyinIndex();

async function initUser() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    currentUserId = session.user.id;
    currentUserName = (session.user.email || '').replace('@herb.local', '');
    localStorage.setItem('herb_last_username', currentUserName);
    if (!restoreSession()) {
      state.mode = 'home';
    }
    render();
    mergeFromCloud().then(() => {
      if (state.mode === 'home') render();
      syncToCloud();
    });
  } else {
    state.mode = 'login';
    render();
  }
}
window.addEventListener('online', () => {
  if (currentUserId) syncToCloud();
});

initUser();
</script>
</body>
